<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gfx studio</title>
<link rel="stylesheet" href="./src/theme/primitives.css">
<link rel="stylesheet" href="./src/theme/scale.css">
<link rel="stylesheet" href="./src/theme/dark.css">
<link rel="stylesheet" href="./src/theme/light.css">
<link rel="stylesheet" href="./src/theme/components.css">
<link rel="stylesheet" href="./src/theme/density.css">
<link rel="stylesheet" href="./src/styles.css">
<link rel="stylesheet" href="./src/toolbar.css">
<link rel="stylesheet" href="./src/comments.css">
<link rel="stylesheet" href="./src/layers.css">
<link rel="stylesheet" href="./src/paths.css">
<link rel="stylesheet" href="./src/render.css">
<link rel="stylesheet" href="./src/claude.css">
<link rel="stylesheet" href="./src/code.css">
<link rel="stylesheet" href="./src/layout.css">
<link rel="stylesheet" href="./src/menu.css">
<link rel="stylesheet" href="./src/settings.css">
<link rel="stylesheet" href="./src/t3.css">
<link rel="stylesheet" href="./src/newscene.css">
<link rel="stylesheet" href="./src/soundtweak.css">
</head>
<body data-density="comfortable">
<div id="app">
  <header id="topbar" class="studio-topbar" data-density="dense">
    <div class="toolbar-left">
      <button id="app-menu-btn" class="tbtn app-menu-btn" aria-label="gfx studio menu" aria-haspopup="menu" aria-expanded="false"><span class="logo" aria-hidden="true"></span><span aria-hidden="true">▾</span></button>
      <nav class="scene-crumb" aria-label="Project and scene">
        <button id="root-btn" class="tbtn crumb-project" title="Switch project"><span class="btn-label">No project</span></button><span class="crumb-slash" aria-hidden="true">/</span>
        <button id="scene-menu-btn" class="tbtn crumb-scene" aria-haspopup="menu" aria-expanded="false" title="Scene"><span class="btn-label">Select scene…</span><span aria-hidden="true">▾</span></button>
      </nav>
      <div class="toolbar-status" aria-live="polite">
        <button id="disk-badge" class="badge warn" title="Changed on disk: reload" aria-label="Changed on disk: reload" hidden><i class="disk-mark" aria-hidden="true">↻</i><span>changed on disk</span></button>
        <span id="claude-chip" class="chip claude-chip" title="Changed by Claude" aria-label="Changed by Claude" hidden><i aria-hidden="true"></i><span>changed by Claude</span></span>
        <span id="synth-chip" class="chip" title="Rendering…" aria-label="Rendering" hidden><i class="spin" aria-hidden="true"></i><span>rendering…</span></span>
      </div>
    </div>
    <div class="seg" id="mode-seg" title="Review: audition + notes. Code: edit the scene's files next to the live picture">
      <button data-m="review" class="on">Review</button><button data-m="code">Code</button>
    </div>
    <div class="toolbar-right">
      <span class="split claude-split" id="claude-split"><button id="claude-btn" class="tbtn claude-btn" title="Claude in terminal"><i class="cl-mark" aria-hidden="true"></i>Claude<b class="t3-badge" hidden>0</b></button><button id="claude-menu-btn" class="tbtn" title="Choose Claude target" aria-label="Choose Claude target" aria-haspopup="menu" aria-expanded="false">▾</button></span>
      <button id="undo-btn" class="tbtn history-btn" title="Undo"><span class="history-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M6 4 3 7l3 3M3 7h6.2a3.8 3.8 0 0 1 0 7.6H7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -1.5)"/></svg></span><span class="history-label">Undo</span></button>
      <button id="redo-btn" class="tbtn history-btn" title="Redo"><span class="history-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M10 4l3 3-3 3M13 7H6.8a3.8 3.8 0 0 0 0 7.6H9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -1.5)"/></svg></span><span class="history-label">Redo</span></button>
      <button id="rq-btn" class="tbtn rq-chip" title="Render queue" hidden><i class="spin" aria-hidden="true"></i><span>Queue</span><b>0</b></button>
      <span class="split" id="render-split" hidden><button id="render-btn" class="tbtn" title="Render dialog">Render</button><button id="render-quick" class="tbtn" title="Render actions" aria-label="Render actions" aria-haspopup="menu" aria-expanded="false">▾</button></span>
      <button id="save-btn" class="primary" title="Save draft">Save draft<i class="dirty" hidden></i></button>
    </div>
  </header>

  <main id="stage"></main>
  <div id="panel-holder" aria-hidden="true">
    <aside id="code-left" data-density="dense" class="panel">
      <div class="tabs"><button data-ct="files" class="on">Files</button><button data-ct="versions">Versions</button></div>
      <div id="code-tree"></div>
      <div id="code-versions" hidden></div>
    </aside>
    <section id="code-main" data-density="dense">
      <div id="code-tabs"></div>
      <div id="code-banner" hidden></div>
      <div id="code-obj" hidden></div>
      <div id="code-editor"></div>
      <div id="code-status"><span id="cs-path"></span><span id="cs-ro" class="pill" hidden>read-only</span><span id="cs-pos"></span><span id="cs-keys" title="Elements created / animated by the cursor line (outlined in the picture)"></span><span class="spacer"></span><button type="button" id="cs-err" class="cs-err" hidden title="Go to the error"></button>
        <label class="chk" title="Save 1.5 s after you stop typing"><input type="checkbox" id="cs-auto"> Auto-save</label>
        <button type="button" id="cs-vscode" class="tbtn sm" title="Open this file at the cursor in VS Code">VS Code</button>
        <button type="button" id="cs-ask" class="tbtn sm" title="Ask Claude about the selection (or the cursor line)">Ask Claude</button>
        <button type="button" id="cs-save" class="primary sm" title="Save the file (Ctrl+S)">Save</button></div>
    </section>
    <aside id="inspector" data-density="dense" class="panel"></aside>
    <section id="viewer">
      <div id="video-wrap">
        <video id="video" muted playsinline preload="auto"></video>
        <div id="empty-msg">Select a scene</div>
        <button type="button" id="empty-new" class="tbtn primary" hidden>Create your first scene</button>
        <div id="vo" data-tool="view">
          <canvas id="draw-canvas"></canvas>
          <div id="tool-catcher"></div>
          <div id="pin-layer"></div>
        </div>
        <div id="live-badge" hidden>RENDERED</div>
        <div id="vtools"></div>
        <div id="draw-bar" hidden></div>
      </div>
      <div id="transport">
        <button id="to-start" class="icon" title="Start (Home)"></button>
        <button id="play" class="icon big" title="Play / pause (Space)"></button>
        <button id="to-end" class="icon" title="End (End)"></button>
        <div class="tc"><b id="tc-time">00.00</b><span id="tc-dur">/ 00.00</span></div>
        <div class="tc dim"><span id="tc-frame">f 0</span></div>
        <div class="spacer"></div>
        <label class="master" title="Master monitoring volume (not saved: the final mix is loudness-normalized). Double-click: reset"><span>Master</span><input id="master-vol" type="range" min="-24" max="12" step="0.5" value="0"><b id="master-db">0.0</b></label>
        <button id="loop-btn" class="tbtn" title="Loop region (shift-drag on the ruler)">Loop</button>
        <div class="seg" id="ab" title="Audition: A = rendered stems on disk, B = draft re-synth (A)">
          <button data-mode="original" aria-label="Original"><span class="ab-long">Original</span><span class="ab-short" aria-hidden="true">A</span></button><button data-mode="draft" aria-label="Draft"><span class="ab-long">Draft</span><span class="ab-short" aria-hidden="true">B</span></button>
        </div>
        <div class="seg small" id="rate"><button data-rate="0.5">0.5×</button><button data-rate="1">1×</button></div>
        <button id="fit-btn" class="tbtn" title="Fit timeline (F)">Fit</button>
      </div>
    </section>
    <div id="code-refs" data-density="dense" class="code-sec"></div>
    <aside id="side" data-density="dense" class="panel">
      <div class="tabs"><button data-tab="comments" class="on">Comments <b id="n-notes">0</b></button><button data-tab="changes">Changes <b id="n-changes">0</b></button><button data-tab="layers" id="tab-layers" hidden>Layers</button><button data-tab="elements" id="tab-elements" hidden>Elements</button><button data-tab="versions" id="tab-versions">Versions</button></div>
      <div id="side-list"></div>
      <div class="side-foot"><button id="add-note" class="tbtn" title="Add a timeline comment at the playhead (N)">+ Comment <kbd>N</kbd></button></div>
    </aside>
    <aside id="render" data-density="comfortable" class="panel" hidden></aside>
    <section id="t3">
      <div id="t3-head"><div class="seg" id="t3-scope"><button type="button" data-scope="project" class="on" title="Threads of this gfx project">This project</button><button type="button" data-scope="folder" title="Threads of every T3 project in this folder, by project">All in folder</button></div>
        <span class="spacer"></span><button type="button" id="t3-new" class="tbtn" title="New thread in this project">+ New thread</button><button type="button" id="t3-refresh" class="icon" title="Refresh">&#8635;</button></div>
      <div id="t3-newrow" hidden><input id="t3-new-title" type="text" placeholder="Thread title (Enter to start, Esc to cancel)" spellcheck="false"><button type="button" id="t3-new-go" class="primary">Start</button></div>
      <div id="t3-note"></div>
      <div id="t3-list" hidden></div>
      <div id="t3-view"><div id="t3-view-ph"></div></div>
    </section>
    <section id="terminal" data-density="dense"><div id="term-tabs"></div><div id="term-host"><div id="term-empty"></div></div></section>
  <section id="timeline" data-density="dense">
    <div id="tl-scroll">
      <div id="tl-inner">
        <div id="tl-heads"></div>
        <div id="tl-canvas-wrap"><canvas id="tl-canvas"></canvas></div>
      </div>
    </div>
  </section>
  </div>
  <div id="note-pop" hidden>
    <div class="np-head"><span id="np-time"></span><span id="np-cue"></span>
      <select id="np-status" title="Status"><option value="open">open</option><option value="resolved">resolved</option><option value="wontfix">won't fix</option></select>
      <button id="np-del" class="link">Delete</button></div>
    <div id="np-reply" hidden></div>
    <textarea id="np-text" rows="3" placeholder="Comment…"></textarea>
    <div class="np-tools"><button id="np-draw" class="tbtn" title="Draw on the frame (D)">Draw<kbd>D</kbd></button><button id="np-attach" class="tbtn" title="Attach an image (or Ctrl+V / drop one here)">Attach</button><input id="np-file" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden><span class="spacer"></span><span id="np-sent" class="t3-sent" hidden title="Sent to T3">&#9992;</span><button id="np-ask" class="tbtn" title="Ask Claude about this comment (terminal or T3)">Ask Claude</button></div>
    <div id="np-atts"></div>
    <div class="np-foot"><span>Enter to save · Esc to close · paste / drop images</span></div>
  </div>
  <div id="att-preview" hidden><img alt=""></div>
  <div id="toast" hidden></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
